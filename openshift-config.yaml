apiVersion: v1
kind: List
items:
  # BuildConfig
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: vr-efficiency-web-query
      labels:
        app: vr-efficiency-web-query
        version: "v2"
    spec:
      source:
        type: Git
        git:
          uri: https://github.com/a9202507/vr_efficiency_web_query.git
          ref: development
      strategy:
        type: Source
        sourceStrategy:
          from:
            kind: ImageStreamTag
            namespace: openshift
            name: python:3.12-ubi8
          env:
            - name: BUILD_LOGLEVEL
              value: "2"
      output:
        to:
          kind: ImageStreamTag
          name: vr-efficiency-web-query:latest
      triggers:
        - type: ConfigChange
        - type: ImageChange

  # ImageStream
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: vr-efficiency-web-query
      labels:
        app: vr-efficiency-web-query
        version: "v2"

  # 使用 Deployment 而非 DeploymentConfig (避免配額限制)
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: vr-efficiency-web-query
      labels:
        app: vr-efficiency-web-query
        version: "v2"
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: vr-efficiency-web-query
      template:
        metadata:
          labels:
            app: vr-efficiency-web-query
        spec:
          containers:
            - name: vr-efficiency-web-query
              image: image-registry.openshift-image-registry.svc:5000/play-efficiency-curve/vr-efficiency-web-query:latest
              ports:
                - containerPort: 5000
                  protocol: TCP
              env:
                - name: SECRET_KEY
                  value: "vr-efficiency-system-secret-2024"
                - name: ADMIN_PASSWORD
                  value: "admin123"
                - name: FLASK_ENV
                  value: "production"
                - name: PORT
                  value: "5000"
              resources:
                limits:
                  memory: "512Mi"
                  cpu: "500m"
                requests:
                  memory: "256Mi"
                  cpu: "100m"
              livenessProbe:
                httpGet:
                  path: /
                  port: 5000
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
              readinessProbe:
                httpGet:
                  path: /
                  port: 5000
                initialDelaySeconds: 5
                periodSeconds: 5
                timeoutSeconds: 3

  # Service
  - apiVersion: v1
    kind: Service
    metadata:
      name: vr-efficiency-web-query
      labels:
        app: vr-efficiency-web-query
        version: "v2"
    spec:
      selector:
        app: vr-efficiency-web-query
      ports:
        - name: web
          port: 5000
          protocol: TCP
          targetPort: 5000
      type: ClusterIP

  # Route
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: vr-efficiency-web-query
      labels:
        app: vr-efficiency-web-query
        version: "v2"
    spec:
      to:
        kind: Service
        name: vr-efficiency-web-query
        weight: 100
      port:
        targetPort: web
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
